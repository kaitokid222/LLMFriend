name: CI
on:
  push:
  pull_request:

jobs:
  headless-core:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: llmfriend_test
          MYSQL_USER: llmfriend
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      LLMFRIEND_TEST_DB: Server=127.0.0.1;Port=3306;Database=llmfriend_test;User ID=llmfriend;Password=test-password;SslMode=None
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core rules
        run: dotnet test tests/LLMFriend.Core.Tests/LLMFriend.Core.Tests.csproj --configuration Release --verbosity quiet
      - name: MySQL contracts
        run: dotnet test tests/LLMFriend.Integration.Tests/LLMFriend.Integration.Tests.csproj --configuration Release --verbosity quiet

  wpf-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows client
        run: dotnet build src/LLMFriend.Wpf/LLMFriend.Wpf.csproj --configuration Release --verbosity quiet
